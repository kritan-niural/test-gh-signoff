name: Lint & Test

on:
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for local result
        id: local
        run: |
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          STATE=$(gh api repos/${{ github.repository }}/statuses/$SHA \
            --jq '[.[] | select(.context=="Lint & Test")][0].state // "none"')
          echo "skip=$([ "$STATE" = "success" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        if: steps.local.outputs.skip != 'true'
        run: echo "Running lint checks..."

      - name: Test
        if: steps.local.outputs.skip != 'true'
        run: echo "Running tests..."
