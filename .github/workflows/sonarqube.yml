name: Sonarqube

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sonarqube:
    name: Sonarqube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for local result
        id: local
        run: |
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          STATE=$(gh api repos/${{ github.repository }}/statuses/$SHA \
            --jq '[.[] | select(.context=="local/sonarqube")][0].state // "none"')
          echo "skip=$([ "$STATE" = "success" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Sonarqube analysis
        if: steps.local.outputs.skip != 'true'
        run: echo "Running Sonarqube analysis..."
